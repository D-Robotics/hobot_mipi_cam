# 01-startup：双目启动阶段 / 首帧启动时间
# 被测配置：双目 1088x1280@30 nv12 / ros / sensor ts / combine=1
# 只开 startup（本轮新增）+ 既有 pub_out/imu_error；不引入其他指标日志。
id: C04
name: dual-1088x1280-nv12-30-combine1
run_label: dual-1088x1280-nv12-30fps-combine1
stage: 01-startup
baseline: false

launch: mipi_cam_eval_dual.launch.py
params:
  device_mode: dual
  dual_combine: 1
  sub_stream_enable: false
  image_width: 1088
  image_height: 1280
  sub_image_width: 544
  sub_image_height: 640
  framerate: 30.0
  sub_framerate: 15.0
  out_format: nv12
  io_method: ros
  frame_ts_type: sensor
  lpwm_enable: false
  gdc_enable: true
  rotation: 0.0
  cal_rotation: 0.0
  channel: 0
  channel2: 2
  imu_type: icm42688

eval:
  log_enable: true
  # 07-combine：combine_out 为本轮直接证据；sync_pair/frame_in/pub_out 为对照
  log_events: [combine_out, sync_pair, frame_in, pub_out, imu_error]
  duration_s: 180

recorder:
  image_topics: [/image_left_raw, /image_right_raw, /image_combine_raw]
  imu_topics: [/imu_data]
  info_topics: [/image_left_raw/camera_info, /image_right_raw/camera_info,
                /image_combine_raw/left/camera_info, /image_combine_raw/right/camera_info]

thresholds: {}
