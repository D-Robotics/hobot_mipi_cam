# 08-device-latency：bgr8 发布路径（NV12→BGR 转换开销）
# 与 C04 同配置，仅 out_format=bgr8；用于对比发布延迟、队列等待与 CPU 路径。
id: C04B
name: dual-1088x1280-bgr8-30-combine1
run_label: dual-1088x1280-bgr8-30fps-combine1
stage: 08-device-latency
baseline: false

launch: mipi_cam_eval_dual.launch.py
params:
  device_mode: dual
  dual_combine: 1
  sub_stream_enable: false
  image_width: 1088
  image_height: 1280
  sub_image_width: 544
  sub_image_height: 640
  framerate: 30.0
  sub_framerate: 15.0
  out_format: bgr8
  io_method: ros
  frame_ts_type: sensor
  lpwm_enable: false
  gdc_enable: true
  rotation: 0.0
  cal_rotation: 0.0
  channel: 0
  channel2: 2
  imu_type: icm42688

eval:
  log_enable: true
  # 08-device-latency：frame_in（就绪时刻）+ pub_out（发布时刻与 deq_mono）+ combine_out
  # queue_stat 用于定位 bgr8 下 combine 未发布的去向（recycled/empty_null/fq_full）
  log_events: [combine_out, frame_in, pub_out, queue_stat]
  duration_s: 180

recorder:
  image_topics: [/image_left_raw, /image_right_raw, /image_combine_raw]
  imu_topics: [/imu_data]
  info_topics: [/image_left_raw/camera_info, /image_right_raw/camera_info,
                /image_combine_raw/left/camera_info, /image_combine_raw/right/camera_info]

thresholds: {}
