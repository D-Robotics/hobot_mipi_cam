# 03-drop 正向对照：C04 双目 + CPU 亲和/yes 压力
# 目的：验证丢弃点计数器确实能抓到丢帧（正常跑 0 丢帧不能证明计数器有效）。
# node 与两个 yes 都钉在 CPU0，制造 capture/publisher 竞争；60s。
id: C04S
name: dual-1088x1280-nv12-30-combine1-stress
run_label: dual-1088x1280-nv12-30fps-combine1-stress
stage: 03-drop
baseline: false

launch: mipi_cam_eval_dual.launch.py
params:
  device_mode: dual
  dual_combine: 1
  sub_stream_enable: false
  image_width: 1088
  image_height: 1280
  sub_image_width: 544
  sub_image_height: 640
  framerate: 30.0
  sub_framerate: 15.0
  out_format: nv12
  io_method: ros
  frame_ts_type: sensor
  lpwm_enable: false
  gdc_enable: true
  rotation: 0.0
  cal_rotation: 0.0
  channel: 0
  channel2: 2
  imu_type: icm42688

eval:
  log_enable: true
  log_events: [sync_pair, frame_in, frame_drop, queue_stat, pub_out, imu_error]
  duration_s: 60

load:
  cpu_affinity: 0
  cmd: "timeout 60 taskset -c 0 yes > /dev/null & timeout 60 taskset -c 0 yes > /dev/null & wait"

recorder:
  image_topics: [/image_left_raw, /image_right_raw, /image_combine_raw]
  imu_topics: [/imu_data]
  info_topics: [/image_left_raw/camera_info, /image_right_raw/camera_info]

thresholds: {}
