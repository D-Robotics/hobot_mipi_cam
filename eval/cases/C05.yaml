# 07-combine：双目 combine=2（只发布拼接图）
# 覆盖：拼接产出本身；不发布左右目，故无 B-11 设备侧对照。
id: C05
name: dual-1088x1280-nv12-30-combine2
run_label: dual-1088x1280-nv12-30fps-combine2
stage: 07-combine
baseline: false

launch: mipi_cam_eval_dual.launch.py
params:
  device_mode: dual
  dual_combine: 2
  sub_stream_enable: false
  image_width: 1088
  image_height: 1280
  sub_image_width: 544
  sub_image_height: 640
  framerate: 30.0
  sub_framerate: 15.0
  out_format: nv12
  io_method: ros
  frame_ts_type: sensor
  lpwm_enable: false
  gdc_enable: true
  rotation: 0.0
  cal_rotation: 0.0
  channel: 0
  channel2: 2
  imu_type: icm42688

eval:
  log_enable: true
  # combine=2 只有拼接 topic，故只订它
  log_events: [combine_out, sync_pair, frame_in]
  duration_s: 180

recorder:
  image_topics: [/image_combine_raw]
  imu_topics: [/imu_data]
  info_topics: [/image_combine_raw/left/camera_info, /image_combine_raw/right/camera_info]

thresholds: {}
