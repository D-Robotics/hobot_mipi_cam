# 07-combine：双目 combine=1 + 辅流（主 30fps / 辅 15fps）
# 覆盖：主/辅两条拼接链、辅流容差（sub_fps）、辅流 topic 契约。
id: C06
name: dual-1088x1280-nv12-30-combine1-sub
run_label: dual-1088x1280-nv12-30fps-combine1-sub
stage: 07-combine
baseline: false

launch: mipi_cam_eval_dual.launch.py
params:
  device_mode: dual
  dual_combine: 1
  sub_stream_enable: true
  image_width: 1088
  image_height: 1280
  sub_image_width: 544
  sub_image_height: 640
  framerate: 30.0
  sub_framerate: 15.0
  out_format: nv12
  io_method: ros
  frame_ts_type: sensor
  lpwm_enable: false
  gdc_enable: true
  rotation: 0.0
  cal_rotation: 0.0
  channel: 0
  channel2: 2
  imu_type: icm42688

eval:
  log_enable: true
  log_events: [combine_out, sync_pair, frame_in, pub_out]
  duration_s: 180

recorder:
  image_topics: [/image_left_raw, /image_right_raw, /image_combine_raw,
                 /sub_image_left_raw, /sub_image_right_raw, /sub_image_combine_raw]
  imu_topics: [/imu_data]
  info_topics: [/image_left_raw/camera_info, /image_right_raw/camera_info,
                /image_combine_raw/left/camera_info, /image_combine_raw/right/camera_info,
                /sub_image_left_raw/camera_info, /sub_image_right_raw/camera_info,
                /sub_image_combine_raw/left/camera_info, /sub_image_combine_raw/right/camera_info]

thresholds: {}
