# 05-exposure：realtime 时间戳语义
# 与 C04 同配置，仅 frame_ts_type=realtime；用于核实 sys_timestamps 被曝光回退后的语义。
id: C08
name: dual-1088x1280-nv12-30-combine1-realtime
run_label: dual-1088x1280-nv12-30fps-combine1-realtime
stage: 05-exposure
baseline: false

launch: mipi_cam_eval_dual.launch.py
params:
  device_mode: dual
  dual_combine: 1
  sub_stream_enable: false
  image_width: 1088
  image_height: 1280
  sub_image_width: 544
  sub_image_height: 640
  framerate: 30.0
  sub_framerate: 15.0
  out_format: nv12
  io_method: ros
  frame_ts_type: realtime
  lpwm_enable: false
  gdc_enable: true
  rotation: 0.0
  cal_rotation: 0.0
  channel: 0
  channel2: 2
  imu_type: icm42688

eval:
  log_enable: true
  # exposure 为本轮新增直接证据；frame_in 仅用于同点交叉校验 ts_frame
  log_events: [exposure, frame_in]
  duration_s: 180

recorder:
  image_topics: [/image_left_raw, /image_right_raw, /image_combine_raw]
  imu_topics: [/imu_data]
  info_topics: [/image_left_raw/camera_info, /image_right_raw/camera_info,
                /image_combine_raw/left/camera_info, /image_combine_raw/right/camera_info]

thresholds: {}
