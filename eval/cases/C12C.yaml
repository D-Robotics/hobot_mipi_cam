# 18-multisub-load：E-06 多订阅者（共 4 个：recorder + 3 额外 hz）
id: C12C
name: dual-1088x1280-nv12-30-combine1-sub4
run_label: dual-1088x1280-nv12-30fps-combine1-sub4
stage: 18-multisub-load
baseline: false

launch: mipi_cam_eval_dual.launch.py
params:
  device_mode: dual
  dual_combine: 1
  sub_stream_enable: false
  image_width: 1088
  image_height: 1280
  sub_image_width: 544
  sub_image_height: 640
  framerate: 30.0
  sub_framerate: 15.0
  out_format: nv12
  io_method: ros
  frame_ts_type: sensor
  lpwm_enable: false
  gdc_enable: true
  rotation: 0.0
  cal_rotation: 0.0
  channel: 0
  channel2: 2
  imu_type: icm42688

eval:
  log_enable: true
  log_events: [frame_in, pub_out]
  duration_s: 120

load:
  cmd: "timeout 110 ros2 topic hz /image_left_raw >/dev/null 2>&1 & timeout 110 ros2 topic hz /image_right_raw >/dev/null 2>&1 & timeout 110 ros2 topic hz /image_combine_raw >/dev/null 2>&1 & wait"

recorder:
  image_topics: [/image_left_raw, /image_right_raw, /image_combine_raw]
  imu_topics: [/imu_data]
  info_topics: [/image_left_raw/camera_info, /image_right_raw/camera_info]

thresholds: {}
