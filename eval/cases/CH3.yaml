# hbmem 轮：shared_mem 无拼接（combine=0）——hbmem 的典型可用形态
# （combine 4.18MB 超 HbmMsg1080P 上限；纯左右目 2.09MB 各自可用）
id: CH3
name: dual-1088x1280-nv12-30-combine0-hbmem
run_label: dual-1088x1280-nv12-30fps-combine0-hbmem
stage: hbmem
baseline: false

launch: mipi_cam_eval_dual.launch.py
params:
  device_mode: dual
  dual_combine: 0
  sub_stream_enable: false
  image_width: 1088
  image_height: 1280
  sub_image_width: 544
  sub_image_height: 640
  framerate: 30.0
  sub_framerate: 15.0
  out_format: nv12
  io_method: shared_mem
  frame_ts_type: sensor
  lpwm_enable: false
  gdc_enable: true
  rotation: 0.0
  cal_rotation: 0.0
  channel: 0
  channel2: 2
  imu_type: icm42688

eval:
  log_enable: true
  log_events: [frame_in, pub_out, frame_drop, queue_stat]
  duration_s: 180

recorder:
  image_topics: []
  imu_topics: []
  hbmem_topics: [/hbmem_left_img, /hbmem_right_img]
  info_topics: [/hbmem_left_img/camera_info, /hbmem_right_img/camera_info]

thresholds: {}
